services:
  db:
    image: postgres:15-alpine
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      POSTGRES_DB: db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime   # <-- corrected
    container_name: mavencode
    ports:
      - "9012:9012"             # <-- fixed to match backend CMD
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/mavencode/core/.env
    environment:
      SERVER: mavencode.api.server
      DATABASE_URL: postgresql://db:db@db:5432/db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime  # <-- run Next.js server
    container_name: react-frontend
    ports:
      - "3000:3000"             # Next.js default
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
